<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf=8">
        <meta name="viewport" content="width=device-width,initial.scale=1.0">
        <title>traingound</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header id="header">
            <div id="infobarHeader">
                <span id="welcome">Welcome back!</span><br>
                <span id="userOutput"></span>
            </div>
            <div id="webTitle">
                <h2>trainground-v2</h2>
                <p>VERSION: <span id="versionOutput"></span></p>
            </div>
            <h2 style="
                position:absolute; 
                right:15px; 
                height:auto;
                width:auto;
                top:-2px;
                color:red;
                text-shadow:
                    0 0 10px red,
                    0 0 15px red,
                    0 0 20px red;
            "><span id="clock"></span></h2>
        </header>
        <main id="main">
            <button onclick="showDevTool()" style="
                display:none;
                position:fixed;
                right:0px;
                background:none;
                color:red;
                text-shadow:
                    0 0 10px red,
                    0 0 15px red,
                    0 0 20px red;
                " id="showDevTool">SHOW</button>
            <div id="devTool">
            </div>
            <div id="interaction">
                <div>
                    <input id="inputText" type="text" placeholder="Name / Title / Target / first">
                    <input id="inputDesc" type="text" placeholder="Description / Text Value / second">
                    <input id="inputValue" type="text" placeholder="Value">
                    <input id="inputD" type="text" placeholder="Input D">
                    <select id="inputSelection">
                        <option>version_update</option>
                        <option>spanish_vocs_easy</option>
                        <option>spanish_vocs_mid</option>
                        <option>spanish_vocs_hard</option>
                        <option>alphaTest_questions</option>
                    </select>
                    <button onclick="interSub()">SUBMIT</button>
                    <button onclick="interClose()">CLOSE</button>
                </div>
            </div>
            <div id="leftSidebar">
                <h3>INDEX</h3>
                <a href="login.html">LOGIN-PAGE</a>
                <a href="index.html">HOME</a>
                <a href="trainground.html">TRAINGROUND</a>
                    <button onclick="indexToggle()"><</button>
            </div>
            <button id="toggleIndexBtn" onclick="indexToggle()">></button>
            <!--BREAKPOINT-->
            <div id="trainyard">
                <div id="leftYard">
                    <p><span id="questionOutput"></span></p>
                </div>
                <div id="rightYard">
                    <p>HUH</p>
                </div>
            </div>
        </main>
        <footer>
            <div id="interfaceYard">
                    
            </div>
        </footer>
        <script src="js/script.js"></script>
        <script src="js/updates.js"></script>
        <script src="js/trainYard.js"></script>
    </body>
</html>
